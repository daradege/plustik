[project]
name = "plustik"
version = "0.1.0"
authors = [
    { name = "Ali Safamanesh", email = "daradege@proton.me" },
]
description = "A Python wrapper for the Soroush Plus Bot API"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }
dependencies = ["aiohttp"]

[project.urls]
github = "https://github.com/daradege/plustik"
website = "https://plustik.vercel.app"
documentation = "https://docs.plustik.vercel.app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plustik"]
